name: Rozetka — швидкі залишки власного складу (API)

# 26.11.2026: між годинними синхронізаціями XML Rozetka продавала вже продані пари (замовлення 913069777).
# Цей синк кожні ~5 хв передає на Rozetka через API зменшення залишків власного складу з KeyCRM.
# 26.11.2026: ВИМКНЕНО за розкладом — Rozetka відхиляє зміни через API для товарів із XML-прайсу
# («Синхронізація товару по прайс-листу. Для редагування товару, необхідно змінити тип синхронізації»).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Лише показати, що буде змінено (1 = так)'
        required: false
        default: '0'

concurrency:
  group: rozetka-stock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Залишки з KeyCRM
        env:
          KEYCRM_API_KEY: ${{ secrets.KEYCRM_API_KEY }}
        run: node builder/keycrm-stock.js

      - name: Залишки на Rozetka через API
        env:
          ROZETKA_API_TOKEN: ${{ secrets.ROZETKA_API_TOKEN }}
          ROZETKA_LOGIN: ${{ secrets.ROZETKA_LOGIN }}
          ROZETKA_PASSWORD: ${{ secrets.ROZETKA_PASSWORD }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          DEBUG_RZ: ${{ github.event.inputs.dry_run }}
        run: node builder/rozetka-stock-push.js

      - name: Зберегти стан і журнал
        if: always()
        run: |
          git config user.name "letimo-feeds-bot"
          git config user.email "feeds-bot@users.noreply.github.com"
          git add -- _data/rz-item-ids.json _data/rz-stock-push.json _data/rz-stock-log.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Без змін"; exit 0; fi
          git commit -m "actions: rozetka stock $(TZ=Europe/Kyiv date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs || { git rebase --abort; git pull --no-rebase -X ours; }
            sleep $((i*5))
          done
          exit 1
