{"name": "Фід Meta (Instagram) — власний склад: Talvi, ДоРечі, взуття", "on": {"schedule": [{"cron": "25 * * * *"}], "workflow_dispatch": {}}, "concurrency": {"group": "meta-own-stock", "cancel-in-progress": false}, "permissions": {"contents": "write"}, "jobs": {"build": {"runs-on": "ubuntu-latest", "timeout-minutes": 15, "steps": [{"uses": "actions/checkout@v4", "with": {"fetch-depth": 1}}, {"uses": "actions/setup-node@v4", "with": {"node-version": "20"}}, {"name": "Залишки з KeyCRM", "env": {"KEYCRM_API_KEY": "${{ secrets.KEYCRM_API_KEY }}"}, "run": "node builder/keycrm-stock.js"}, {"name": "Зібрати фід", "env": {"SD_YML_URL": "${{ secrets.SD_YML_URL }}"}, "run": "if [ -s _data/keycrm-stock.yml ]; then export SD_YML_URL=\"file://$GITHUB_WORKSPACE/_data/keycrm-stock.yml\"; fi; node builder/meta-own-stock.js"}, {"name": "Окремий каталог Meta: Timi Tex (meta-timitex.xml)", "continue-on-error": true, "env": {"SD_YML_URL": "${{ secrets.SD_YML_URL }}", "META_BRANDS": "Timi Tex", "META_OUT": "meta-timitex.xml", "META_MIN": "10"}, "run": "if [ -s _data/keycrm-stock.yml ]; then export SD_YML_URL=\"file://$GITHUB_WORKSPACE/_data/keycrm-stock.yml\"; fi; node builder/meta-own-stock.js"}, {"name": "Опублікувати", "run": "git config user.name letimo-feeds-bot; git config user.email feeds-bot@users.noreply.github.com; git add -- meta-insta.xml; if [ -f meta-timitex.xml ]; then git add -- meta-timitex.xml; fi; if git diff --cached --quiet; then echo no-changes; exit 0; fi; git commit -m \"actions: meta-own-stock $(TZ=Europe/Kyiv date '+%Y-%m-%d %H:%M')\"; for i in 1 2 3 4 5 6; do if git push; then exit 0; fi; git pull --rebase --autostash -X theirs || { git rebase --abort 2>/dev/null || true; git pull --no-rebase --autostash -X ours || true; }; sleep $((i*5)); done; exit 1"}]}}}