name: Фіди маркетплейсів (Prom, Kasta, Rozetka)

on:
  push:
    branches: [main]
    paths: ['_data/tick.txt']   # «пульс» від Apps Script кожні 30 хв (розклад GitHub ненадійний)
  schedule:
    - cron: '15,45 * * * *'   # кожні 30 хв
  workflow_dispatch:
    inputs:
      prom_push:
        description: 'Наявність на Prom через API: порожньо = live (якщо є PROM_API_TOKEN); test:<id>'
        required: false
        default: ''
      kasta_push:
        description: 'Залишки на Kasta через API: порожньо = live (якщо є KASTA_API_TOKEN); probe; test:<id>'
        required: false
        default: ''

concurrency:
  group: feeds-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Залишки з KeyCRM
        env:
          KEYCRM_API_KEY: ${{ secrets.KEYCRM_API_KEY }}
        run: node builder/keycrm-stock.js

      - name: Зібрати фіди
        env:
          MB_FEED_URL: ${{ secrets.MB_FEED_URL }}
          DR_FEED_URL: ${{ secrets.DR_FEED_URL }}
          SD_YML_URL: ${{ secrets.SD_YML_URL }}
          FEEDS_LIVE: ${{ vars.FEEDS_LIVE }}
        run: |
          if [ -s _data/keycrm-stock.yml ]; then export SD_YML_URL="file://$GITHUB_WORKSPACE/_data/keycrm-stock.yml"; echo "Залишки власного складу: KeyCRM"; else echo "Залишки власного складу: SalesDrive (запасне)"; fi
          node --max-old-space-size=6144 builder/run.js prom kasta rozetka

      - name: Наявність на Prom через API (одразу, не чекаючи імпорту раз на 4 год)
        continue-on-error: true
        env:
          PROM_API_TOKEN: ${{ secrets.PROM_API_TOKEN }}
          PROM_PUSH: ${{ github.event.inputs.prom_push || vars.PROM_PUSH || 'live' }}
        run: node builder/prom-stock-push.js

      - name: Залишки на Kasta через API (одразу, не чекаючи, поки Kasta перечитає файл)
        continue-on-error: true
        env:
          KASTA_API_TOKEN: ${{ secrets.KASTA_API_TOKEN }}
          KASTA_PUSH: ${{ github.event.inputs.kasta_push || vars.KASTA_PUSH || 'live' }}
          KASTA_ID_PREFIX: ${{ vars.KASTA_ID_PREFIX || 'rzid_' }}
        run: node builder/kasta-stock-push.js

      - name: Опублікувати
        run: |
          git config user.name "letimo-feeds-bot"
          git config user.email "feeds-bot@users.noreply.github.com"
          git add -A -- '*.xml' '*.xml.gz' '_test/*' || true
          for f in _data/prom-stock-push.json _data/prom-stock-log.json _data/kasta-stock-push.json _data/kasta-stock-log.json; do if [ -f "$f" ]; then git add -- "$f"; fi; done
          if git diff --cached --quiet; then echo "Без змін"; exit 0; fi
          git commit -m "actions: prom kasta rozetka $(TZ=Europe/Kyiv date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs || { git rebase --abort; git pull --no-rebase -X ours; }
            sleep $((i*5))
          done
          exit 1
