name: Фід Meta (Instagram) — Talvi, ДоРечі, взуття

on:
  schedule:
    - cron: '25 * * * *'   # щогодини
  workflow_dispatch: {}

concurrency:
  group: meta-insta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Зібрати фід
        run: node builder/meta-insta.js
      - name: Опублікувати
        run: |
          git config user.name "letimo-feeds-bot"
          git config user.email "feeds-bot@users.noreply.github.com"
          git add -- meta-insta.xml
          if git diff --cached --quiet; then echo "Без змін"; exit 0; fi
          git commit -m "actions: meta-insta $(TZ=Europe/Kyiv date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5 6; do
            if git push; then exit 0; fi
            git pull --rebase --autostash -X theirs || { git rebase --abort 2>/dev/null || true; git pull --no-rebase --autostash -X ours || true; }
            sleep $((i*5))
          done
          exit 1
