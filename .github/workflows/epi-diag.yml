name: Діагностика довідників Епіцентру
on:
  push:
    paths: ['_diag/epi-diag.run']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Опції атрибутів
        env:
          EPICENTR_TOKEN: ${{ secrets.EPICENTR_TOKEN }}
        run: |
          T=$(printf %s "$EPICENTR_TOKEN" | tr -d '\r\n\t ')
          : > _diag/epi-options.txt
          while read -r SET ATTR; do
            [ -z "$SET" ] && continue
            echo "== $SET / $ATTR" >> _diag/epi-options.txt
            for p in 1 2 3; do
              curl -s -H "Authorization: Bearer $T" -H "Accept: application/json" "https://merchant-api.epicentrm.com.ua/v2/pim/attribute-sets/$SET/attributes/$ATTR/options?page=$p" | python3 -c "import sys,json
          try:
            j=json.load(sys.stdin); it=j.get('items') or j.get('data') or []
            print('\n'.join('%s\t%s'%(o.get('code'),(o.get('translations') or [{}])[0].get('title') if o.get('translations') else o.get('title')) for o in it))
          except Exception as e: print('ERR',e)" >> _diag/epi-options.txt
            done
          done < _diag/epi-diag.run
      - name: Зберегти
        run: |
          git config user.name "letimo-feeds-bot"; git config user.email "feeds-bot@users.noreply.github.com"
          git add _diag/epi-options.txt; git commit -m "diag: опції Епіцентру" || exit 0
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
